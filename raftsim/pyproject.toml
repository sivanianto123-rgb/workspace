[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raftsim"
version = "0.1.0"
description = "A small, deterministic simulation of the Raft consensus algorithm."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
raftsim = "raftsim.cli:main"

[tool.setuptools.packages.find]
include = ["raftsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
