AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  ragdesk — a webhook-triggered RAG assistant. Deploys a single Lambda
  function behind an HTTP API with two signed routes: /webhook/query
  (ask a question) and /webhook/ingest (push a doc update).

Parameters:
  WebhookSecret:
    Type: String
    NoEcho: true
    Description: Shared HMAC secret webhook callers must sign requests with.

Globals:
  Function:
    Timeout: 15
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        RAGDESK_WEBHOOK_SECRET: !Ref WebhookSecret

Resources:
  RagdeskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ragdesk
      Handler: ragdesk.lambda_function.handler
      CodeUri: .
      Events:
        Query:
          Type: HttpApi
          Properties:
            Path: /webhook/query
            Method: POST
        Ingest:
          Type: HttpApi
          Properties:
            Path: /webhook/ingest
            Method: POST

Outputs:
  ApiBaseUrl:
    Description: Invoke URL for the deployed HTTP API.
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionName:
    Value: !Ref RagdeskFunction
