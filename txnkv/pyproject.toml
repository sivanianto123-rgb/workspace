[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "txnkv"
version = "0.1.0"
description = "A transactional key-value store built on a write-ahead log with MVCC snapshot isolation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
txnkv = "txnkv.cli:main"

[tool.setuptools.packages.find]
include = ["txnkv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
