[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vecsearch"
version = "0.1.0"
description = "Vector search from scratch: exact brute force, a NSW graph, and a full HNSW index."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
vecsearch = "vecsearch.cli:main"

[tool.setuptools.packages.find]
include = ["vecsearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
