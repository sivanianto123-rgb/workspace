<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Motion Portfolio</title>
  <meta name="description" content="Motion design portfolio — showreel, case studies and contact." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="cursor" aria-hidden="true"></div>

  <header class="nav">
    <a href="#top" class="logo" data-name>Your Name</a>
    <nav>
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <!-- HERO -->
    <section class="hero">
      <canvas id="hero-canvas" aria-hidden="true"></canvas>
      <div class="hero-inner">
        <p class="eyebrow"><span data-role>Motion Designer</span> · <span data-location>City</span></p>
        <h1 class="kinetic" data-kinetic>Things<br />that move.</h1>
        <p class="tagline" data-tagline></p>
        <div class="hero-actions">
          <button class="btn btn-primary" id="play-reel">
            <span class="play-icon" aria-hidden="true"></span> Watch showreel
          </button>
          <a class="btn btn-ghost" href="#work">See projects</a>
        </div>
      </div>
      <div class="scroll-hint" aria-hidden="true">scroll</div>
    </section>

    <!-- MARQUEE -->
    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

    <!-- WORK -->
    <section id="work" class="section">
      <div class="section-head">
        <h2 class="reveal">Selected work</h2>
        <p class="muted reveal">Click a project for the full case study.</p>
      </div>
      <div class="grid" id="project-grid"></div>
    </section>

    <!-- ABOUT -->
    <section id="about" class="section about">
      <h2 class="reveal">About</h2>
      <div class="about-cols">
        <div class="about-text reveal" id="about-text"></div>
        <div class="about-lists reveal">
          <h3>Tools</h3>
          <ul class="chips" id="tools"></ul>
          <h3>What I do</h3>
          <ul class="chips" id="skills"></ul>
          <a class="btn btn-ghost" id="cv-link" href="#" target="_blank" rel="noopener" hidden>Download CV</a>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="section contact">
      <p class="eyebrow reveal">Got a project?</p>
      <a class="big-email reveal" id="email-link" href="#">say hello</a>
      <ul class="socials reveal" id="socials"></ul>
    </section>
  </main>

  <footer class="footer">
    <span>© <span id="year"></span> <span data-name>Your Name</span></span>
    <a href="#top">Back to top ↑</a>
  </footer>

  <!-- MODAL (reel + case studies) -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel">
      <button class="modal-close" data-close aria-label="Close">×</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
